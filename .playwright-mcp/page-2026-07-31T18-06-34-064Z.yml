          - tabpanel "Description & features" [ref=f17e93]:
            - generic [ref=f17e98]:
              - generic [ref=f17e101]:
                - paragraph [ref=f17e102]: The LM5143-Q1-EVM2100 high density evaluation module (EVM) is designed to showcase the performance of the LM5143-Q1 high performance, dual-channel, automotive synchronous buck DC/DC buck controller. It operates over a wide input voltage range of 3.5 V to 36 V to deliver fixed 5-V and 3.3-V outputs with better than 1% setpoint accuracy and currents up to 7 A per channel. By virtue of the LM5143-Q1's minimum on-time of 65 ns, operation at very low duty cycle is feasible. The LM5143-Q1 offers a full suite of protection features to ensure protection of the regulator during fault conditions. These include undervoltage lockout to ensure proper operation during voltage-sag conditions, programmable soft-start to reduce inrush current, hiccup-mode overcurrent protection and thermal shutdown. Open-drain PGOOD indicator and SYNC IN / SYNC OUT features are also provided.
                - heading "Features" [level=5] [ref=f17e103]
                - list [ref=f17e105]:
                  - listitem [ref=f17e106]: 3.5-V to 36-V input voltage range
                  - listitem [ref=f17e107]: 5-V and 3.3-V output voltages with 1% setpoint accuracy
                  - listitem [ref=f17e108]: Rated for up to 7 A of load current per channel
                  - listitem [ref=f17e109]: Automotive grade power stage components, including MOSFETs, inductors and capacitors
                  - listitem [ref=f17e110]: 2.1-MHz switching synchronizable up or down with external clock
                  - listitem [ref=f17e111]: Fully assembled, tested and proven PCB layout with small footprint
              - button "Expand to view more content (visual only)" [ref=f17e113] [cursor=pointer]:
                - text: View all
                - generic [ref=f17e114]: chevron-down
