          - tabpanel "Description & features" [ref=f20e98]:
            - generic [ref=f20e106]:
              - paragraph [ref=f20e107]: The LM5123EVM-BST evaluation module showcases the features and performance of the LM5123-Q1 wide input voltage synchronous boost controller. The standard configuration is designed to provide a regulated output of 24 V at 100 W, from an input voltage of 9 V to 18 V and switching at 440 kHz. The output voltage can be dynamically modified up to 45 V at 100 W using the TRK pin of the LM5123-Q1.
              - paragraph [ref=f20e108]:
                - text: This EVM is designed for ease of configuration, enabling a user to evaluate many different applications on the same module. Functionality includes; low IQ operation, internal feedback resistors, bypass mode operation when V
                - subscript [ref=f20e109]: IN
                - text: is greater than V
                - subscript [ref=f20e110]: OUT
                - text: ", dynamic output voltage tracking, power good (PGOOD) indicator, programmable frequency dithering, programmable under voltage lock out (UVLO), and over voltage protection."
              - heading "Features" [level=5] [ref=f20e111]
              - list [ref=f20e113]:
                - listitem [ref=f20e114]: "Input voltage range: 9 V to 18 V"
                - listitem [ref=f20e115]: Output voltage 24 V at 100 W
                - listitem [ref=f20e116]: 440 kHz switching frequency
                - listitem [ref=f20e117]: Dynamically configurable output voltage up to 45 V at 100 W
