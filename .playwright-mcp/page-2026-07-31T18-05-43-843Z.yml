            - generic [ref=f11e104]:
              - paragraph [ref=f11e105]: The LM5122EVM-1PH evaluation module (EVM) provides the design engineer with a fully functional synchronous boost converter to evaluate the Texas Instruments LM5122 synchronous boost controller IC. The EVM provides 24V output at up to 4.5A current from a 9V to 20V input. The EVM is designed to start up from a single power supply without any additional bias voltage.
