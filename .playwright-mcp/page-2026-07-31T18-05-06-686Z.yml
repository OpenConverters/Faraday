          - tabpanel "Description & features" [ref=f8e89]:
            - generic [ref=f8e97]:
              - paragraph [ref=f8e98]: TPS23754EVM-420 contains evaluation and reference circuitry for the TPS23754, which is a Class 4 (25.5 W) PoE PD + PWM Controller. The TPS23754 is targeted at wide Vin aplications (24 V - 60 V) in isolated converter topologies and is compliant with the IEEE 802.3at Power over Ethernet (PoE) standard. This synchronous flyback EVM contains input and output power connectors and an array of on board test points for circuit evaluation. An active clamp forward, 12-V, 30-W EVM (TPS23754EVM-383) is also available.
              - heading "Features" [level=5] [ref=f8e99]
              - list [ref=f8e101]:
                - listitem [ref=f8e102]: Efficient, general market design
                - listitem [ref=f8e103]: Self driven, synchronous rectified secondary
                - listitem [ref=f8e104]: 25-W output power from power over ethernet (PoE), 30-W output power from a 48-V adapter
                - listitem [ref=f8e105]: Operates from either PoE or external adaptors (24 and 48 V)
                - listitem [ref=f8e106]: 5-V output voltage
