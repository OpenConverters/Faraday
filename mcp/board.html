<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Faraday board review</title>
    <style>
      :root {
        --fg: #1c1f24; --muted: #6b7280; --line: #d7dbe0; --card: rgba(0,0,0,.04);
        --accent: #1d6fd8; --high: #b3261e; --medium: #a4680a; --low: #1a7f4b; --info: #6b7280;
        --chosen: rgba(29,111,216,.12);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e7e9ee; --muted: #9aa3b0; --line: #333a44; --card: rgba(255,255,255,.06);
          --accent: #5aa9ff; --high: #ff7a70; --medium: #e0a83a; --low: #52c98a; --info: #9aa3b0;
          --chosen: rgba(90,169,255,.16);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0; background: transparent; color: var(--fg);
        font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      #app { padding: 10px 12px 12px; }
      .pad { padding: 14px 2px; }
      .muted { color: var(--muted); }
      .err { background: rgba(255,93,85,.12); border-radius: 6px; padding: 8px 10px; }
      h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: -.01em; }
      .head { margin-bottom: 8px; }
      .sub { color: var(--muted); font-size: 11.5px; margin-top: 3px; }
      /* Coverage, not decoration: what the screen dropped has to be as visible as what it
         kept, or 200 of 428 findings reads as the whole board. */
      .sub.omitted { color: var(--medium); }
      .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 5px; }
      .chip {
        font-size: 11px; border-radius: 4px; padding: 1.5px 7px;
        border: 1px solid var(--line); color: var(--muted);
      }
      .chip.high { color: var(--high); border-color: var(--high); }
      .chip.medium { color: var(--medium); border-color: var(--medium); }
      .chip.low { color: var(--low); border-color: var(--low); }
      /* The board is the point: give it the room and let the list scroll beside it. */
      .split { display: grid; grid-template-columns: 1fr 300px; gap: 10px; align-items: start; }
      @media (max-width: 820px) { .split { grid-template-columns: 1fr; } }
      .boardpane { min-width: 0; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
      .list { list-style: none; margin: 0; padding: 0; max-height: 620px; overflow-y: auto; }
      .item {
        padding: 6px 8px; border-bottom: 1px solid var(--line); cursor: pointer;
        border-left: 3px solid transparent;
      }
      .item:hover { background: var(--card); }
      .item.chosen { background: var(--chosen); border-left-color: var(--accent); }
      .item.high { border-left-color: var(--high); }
      .item.medium { border-left-color: var(--medium); }
      .item.low { border-left-color: var(--low); }
      .itemhead { display: flex; gap: 6px; align-items: baseline; }
      .fid { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; color: var(--muted); }
      .sev { font-size: 10.5px; font-weight: 650; text-transform: uppercase; letter-spacing: .04em; }
      .sev.high { color: var(--high); } .sev.medium { color: var(--medium); }
      .sev.low { color: var(--low); } .sev.info { color: var(--info); }
      .rule { font-size: 11px; color: var(--muted); }
      .title { font-size: 12px; margin-top: 2px; }
      .nets { font-size: 11px; color: var(--muted); margin-top: 2px; word-break: break-all; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/board.js"></script>
  </body>
</html>
