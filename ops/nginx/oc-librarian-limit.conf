# Rate limit for the librarian part-sourcing endpoint (Faraday's part inspector
# -> Heaviside). Each request spends a real Digi-Key API call against our
# account, so this is a budget guard, not just an abuse guard.
# 20 per minute per client, with a small burst for someone clicking through a
# few unknown parts on one board.
limit_req_zone $binary_remote_addr zone=oc_librarian:1m rate=20r/m;
